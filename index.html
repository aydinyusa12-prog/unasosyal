<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d18"><title>UN AsosyaL</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d18;color:#fff;font:15px Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#7541b5;color:#fff}.secondary{background:#292139;color:#d8c7f3}.danger{background:#4a253e}.hidden{display:none!important}.wrap{max-width:760px;margin:auto;min-height:100dvh;padding:16px 14px 88px}.brand{font-size:25px;font-weight:bold;color:#bd91ff;margin:8px 0 20px}.card{background:#191426;border:1px solid #302344;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#ae9cbe;font-size:13px}.field{width:100%;padding:13px;margin:6px 0 12px;border:0;border-radius:10px;background:#292139;color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#191426;border-top:1px solid #302344;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:5}.tabs button{flex:1;background:transparent;color:#bba9d0;padding:9px 3px;font-size:12px}.tabs button.active{color:#d2aaff}.person,.post,.notif{background:#211a30;border-radius:12px;padding:13px;margin:9px 0}.person{display:flex;justify-content:space-between;align-items:center;gap:8px}.person strong{display:block}.stats{display:flex;justify-content:center;gap:28px;text-align:center;margin:16px}.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#ae9cbe}.error{color:#ff9cac;min-height:20px}.success{color:#a8e6b2}.post p{white-space:pre-wrap;overflow-wrap:anywhere}.post small{color:#ae9cbe}.chatbox{height:48vh;overflow:auto;background:#15111f;border-radius:12px;padding:10px}.bubble{max-width:82%;background:#292139;border-radius:14px;padding:10px;margin:8px 0;overflow-wrap:anywhere}.mine{margin-left:auto;background:#7541b5}.navhead{display:flex;justify-content:space-between;align-items:center}.pill{font-size:12px;color:#d7b9ff}.toggle{display:flex;align-items:center;gap:8px;margin:12px 0}.tiny{font-size:12px}
</style></head><body><main class="wrap">
<div class="brand">UN AsosyaL</div>
<section id="auth" class="card"><h2 id="authTitle">Giriş yap</h2><div id="registerFields" class="hidden"><input id="displayName" class="field" placeholder="Görünen ad"><input id="username" class="field" placeholder="Kullanıcı adı (3-20 karakter)"></div><input id="email" class="field" type="email" autocomplete="email" placeholder="E-posta adresi"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Şifre (en az 6 karakter)"><button id="authBtn" style="width:100%">Giriş yap</button><button id="modeBtn" class="secondary" style="width:100%;margin-top:8px">Hesabın yok mu? Kayıt ol</button><p id="authError" class="error"></p><p class="muted tiny">Hesaplar Firebase ile saklanır. Şifren uygulamada düz metin olarak tutulmaz.</p></section>
<section id="app" class="hidden"><div class="navhead"><h2 id="viewTitle">Akış</h2><button id="logout" class="secondary">Çıkış</button></div>
<section id="feedView"><div class="card"><textarea id="postText" class="field" rows="3" maxlength="1000" placeholder="Ne paylaşmak istersin?"></textarea><button id="publish">Paylaş</button></div><div id="feedList"></div></section>
<section id="peopleView" class="hidden"><input id="peopleSearch" class="field" placeholder="Kullanıcı ara"><div id="peopleList"></div></section>
<section id="profileView" class="hidden"><div class="card" style="text-align:center"><div style="font-size:48px">👤</div><h2 id="myName"></h2><div id="myHandle" class="muted"></div><div class="stats"><div><b id="followers">0</b><span>Takipçi</span></div><div><b id="following">0</b><span>Takip edilen</span></div><div><b id="myPosts">0</b><span>Paylaşım</span></div></div><label class="toggle"><input type="checkbox" id="privateToggle"> Gizli hesap</label><button id="installBtn" class="secondary" style="width:100%">📲 Uygulamayı telefona kur</button><button id="notifyBtn" class="secondary" style="width:100%;margin-top:8px">🔔 Bildirimleri aç</button><p id="profileMsg" class="muted"></p></div><h3>Takip istekleri</h3><div id="requests"></div></section>
<section id="chatView" class="hidden"><div class="card"><div class="navhead"><strong id="chatWith">Sohbet</strong><button id="backPeople" class="secondary">Kişiler</button></div><div id="chatMessages" class="chatbox"></div><div class="row" style="margin-top:8px"><input id="chatInput" class="field" placeholder="Mesaj yaz..."><button id="sendMsg">Gönder</button></div><p id="chatError" class="error"></p></div></section>
<section id="noticeView" class="hidden"><div id="noticeList"></div></section>
</section></main>
<nav id="tabs" class="tabs hidden"><button data-view="feedView" class="active">🏠<br>Akış</button><button data-view="peopleView">🔎<br>Kişiler</button><button data-view="noticeView">🔔<br>Bildirim</button><button data-view="profileView">👤<br>Profil</button></nav>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,collection,getDocs,query,where,addDoc,onSnapshot,updateDoc,deleteDoc,serverTimestamp,orderBy,limit} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCSzI5YqvlYezCWsHCfUDEr6sDWf6al4bw',authDomain:'un-asosyal.firebaseapp.com',projectId:'un-asosyal',storageBucket:'un-asosyal.firebasestorage.app',messagingSenderId:'176707085650',appId:'1:176707085650:web:1a8a7ec17e63bee327c68b'};
const appFB=initializeApp(firebaseConfig),auth=getAuth(appFB),db=getFirestore(appFB);const $=id=>document.getElementById(id);let registering=false,me=null,chatUser=null,unsubChat=null,installPrompt=null,unsubNotices=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(e){return e?.code==='auth/email-already-in-use'?'Bu e-posta zaten kayıtlı.':e?.code==='auth/invalid-credential'?'E-posta veya şifre hatalı.':e?.code==='auth/weak-password'?'Şifre en az 6 karakter olmalı.':e?.code==='auth/too-many-requests'?'Çok fazla deneme yapıldı; biraz sonra tekrar dene.':e?.message||'Bir hata oluştu.'}
$('modeBtn').onclick=()=>{registering=!registering;$('registerFields').classList.toggle('hidden',!registering);$('authTitle').textContent=registering?'Hesap oluştur':'Giriş yap';$('authBtn').textContent=registering?'Kayıt ol':'Giriş yap';$('modeBtn').textContent=registering?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';$('authError').textContent='';$('password').autocomplete=registering?'new-password':'current-password'};
$('authBtn').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value; $('authError').textContent='';try{if(!email||!password)throw Error('E-posta ve şifre gerekli.');if(registering){const username=$('username').value.trim().toLowerCase(),displayName=$('displayName').value.trim();if(!/^[a-z0-9_.]{3,20}$/.test(username))throw Error('Kullanıcı adı 3-20 karakter olmalı; harf, rakam, _ ve . kullan.');if(!displayName)throw Error('Görünen adını yaz.');const taken=await getDoc(doc(db,'usernames',username));if(taken.exists())throw Error('Bu kullanıcı adı alınmış.');const cred=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,email,username,displayName,private:false,createdAt:serverTimestamp()});await setDoc(doc(db,'usernames',username),{uid:cred.user.uid});}else await signInWithEmailAndPassword(auth,email,password);}catch(e){$('authError').textContent=msg(e)}};
onAuthStateChanged(auth,async user=>{if(!user){me=null;$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('tabs').classList.add('hidden');if(unsubNotices)unsubNotices();return}const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()){$('authError').textContent='Kullanıcı profili bulunamadı.';return}me={uid:user.uid,...snap.data()};$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('tabs').classList.remove('hidden');await refreshAll();listenNotices();show('feedView')});
$('logout').onclick=()=>signOut(auth);
function show(id){['feedView','peopleView','profileView','chatView','noticeView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('viewTitle').textContent=({feedView:'Akış',peopleView:'Kişiler',profileView:'Profil',chatView:'Mesajlar',noticeView:'Bildirimler'})[id];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.view));
async function refreshAll(){await Promise.all([loadFeed(),loadPeople(),loadProfile()])}
async function allUsers(){const s=await getDocs(collection(db,'users'));return s.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.uid!==me.uid)}
async function followData(uid){const [a,b]=await Promise.all([getDocs(query(collection(db,'follows'),where('follower','==',uid))),getDocs(query(collection(db,'follows'),where('following','==',uid)))]);return {following:a.docs.map(d=>d.data().following),followers:b.docs.map(d=>d.data().follower)}}
async function loadPeople(){const users=await allUsers(),mine=await followData(me.uid);const requests=await getDocs(query(collection(db,'followRequests'),where('to','==',me.uid)));const reqSet=new Set(requests.docs.map(d=>d.data().from));const search=$('peopleSearch').value.toLowerCase();$('peopleList').innerHTML='';for(const u of users.filter(x=>(x.username+' '+x.displayName).toLowerCase().includes(search))){const isFollowing=mine.following.includes(u.uid),isFollower=mine.followers.includes(u.uid),requestSent=reqSet.has(u.uid);const row=document.createElement('div');row.className='person';const action=u.private?(isFollowing?'<button data-unfollow>Takipten çık</button>':requestSent?'<button class="secondary" disabled>İstek gönderildi</button>':'<button data-follow>İstek gönder</button>'):(isFollowing?'<button data-unfollow>Takipten çık</button>':'<button data-follow>Takip et</button>');row.innerHTML=`<div><strong>${esc(u.displayName)}</strong><span class="muted">@${esc(u.username)} ${isFollower?'· Seni takip ediyor':''}</span></div><div>${action} <button class="secondary" data-profile>Profil</button></div>`;row.querySelector('[data-follow]')?.addEventListener('click',()=>follow(u));row.querySelector('[data-unfollow]')?.addEventListener('click',()=>unfollow(u));row.querySelector('[data-profile]')?.addEventListener('click',()=>viewUser(u));$('peopleList').append(row)}}
$('peopleSearch').oninput=()=>loadPeople();
async function notify(to,type,text,from=me.uid){await addDoc(collection(db,'notifications'),{to,from,type,text,read:false,createdAt:serverTimestamp()})}
async function follow(u){try{if(u.private){await addDoc(collection(db,'followRequests'),{from:me.uid,to:u.uid,createdAt:serverTimestamp()});await notify(u.uid,'request',me.displayName+' takip isteği gönderdi.')}else{await setDoc(doc(db,'follows',me.uid+'_'+u.uid),{follower:me.uid,following:u.uid,createdAt:serverTimestamp()});await notify(u.uid,'follow',me.displayName+' seni takip etmeye başladı.')}await loadPeople();await loadProfile()}catch(e){alert(msg(e))}}
async function unfollow(u){await deleteDoc(doc(db,'follows',me.uid+'_'+u.uid));await loadPeople();await loadProfile()}
async function viewUser(u){const counts=await followData(u.uid),mine=await followData(me.uid),following=mine.following.includes(u.uid);if(u.private&&!following){alert('Bu hesap gizli. Paylaşımlarını görmek için takip isteği göndermelisin.');return}const canMessage=following&&counts.following.includes(me.uid);if(canMessage){openChat(u);return}alert('Mesaj göndermek için birbirinizi takip etmeniz gerekiyor.');}
async function loadProfile(){const counts=await followData(me.uid),posts=await getDocs(query(collection(db,'posts'),where('uid','==',me.uid)));$('myName').textContent=me.displayName;$('myHandle').textContent='@'+me.username;$('followers').textContent=counts.followers.length;$('following').textContent=counts.following.length;$('myPosts').textContent=posts.size;$('privateToggle').checked=!!me.private;const rq=await getDocs(query(collection(db,'followRequests'),where('to','==',me.uid)));$('requests').innerHTML='';for(const d of rq.docs){const r=d.data(),us=await getDoc(doc(db,'users',r.from));if(!us.exists())continue;const u=us.data(),el=document.createElement('div');el.className='person';el.innerHTML=`<span><b>${esc(u.displayName)}</b><small class="muted"> @${esc(u.username)}</small></span><button>Kabul et</button>`;el.querySelector('button').onclick=async()=>{await setDoc(doc(db,'follows',r.from+'_'+me.uid),{follower:r.from,following:me.uid,createdAt:serverTimestamp()});await deleteDoc(d.ref);await notify(r.from,'accepted',me.displayName+' takip isteğini kabul etti.');loadProfile();loadPeople()};$('requests').append(el)}}
$('privateToggle').onchange=async()=>{me.private=$('privateToggle').checked;await updateDoc(doc(db,'users',me.uid),{private:me.private});$('profileMsg').textContent=me.private?'Hesabın artık gizli.':'Hesabın herkese açık.';};
$('publish').onclick=async()=>{const text=$('postText').value.trim();if(!text)return;try{await addDoc(collection(db,'posts'),{uid:me.uid,username:me.username,displayName:me.displayName,text,createdAt:serverTimestamp()});$('postText').value='';await loadFeed();await loadProfile()}catch(e){alert(msg(e))}};
async function loadFeed(){const s=await getDocs(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(60)));const follows=await followData(me.uid);$('feedList').innerHTML='';for(const d of s.docs){const p=d.data();if(p.uid!==me.uid&&!follows.following.includes(p.uid)){const us=await getDoc(doc(db,'users',p.uid));if(us.exists()&&us.data().private)continue}const el=document.createElement('article');el.className='post';el.innerHTML=`<b>${esc(p.displayName||'Kullanıcı')}</b> <small>@${esc(p.username||'')}</small><p>${esc(p.text)}</p><small>${p.createdAt?.toDate?.().toLocaleString('tr-TR')||'Yeni paylaşım'}</small>`;$('feedList').append(el)}}
async function openChat(u){const counts=await followData(u.uid),mine=await followData(me.uid);if(!mine.following.includes(u.uid)||!counts.following.includes(me.uid)){alert('Mesaj göndermek için karşılıklı takip gerekiyor.');return}chatUser=u;$('chatWith').textContent=u.displayName+' (@'+u.username+')';show('chatView');if(unsubChat)unsubChat();const ids=[me.uid,u.uid].sort(),cid=ids.join('_');unsubChat=onSnapshot(query(collection(db,'chats',cid,'messages'),orderBy('createdAt','asc')),s=>{$('chatMessages').innerHTML='';s.forEach(d=>{const m=d.data(),el=document.createElement('div');el.className='bubble '+(m.from===me.uid?'mine':'');el.textContent=m.text;$('chatMessages').append(el)});$('chatMessages').scrollTop=$('chatMessages').scrollHeight})}
$('sendMsg').onclick=async()=>{const text=$('chatInput').value.trim();if(!text||!chatUser)return;const counts=await followData(chatUser.uid),mine=await followData(me.uid);if(!mine.following.includes(chatUser.uid)||!counts.following.includes(me.uid)){$('chatError').textContent='Artık karşılıklı takip etmiyorsunuz; mesaj gönderilemez.';return}const cid=[me.uid,chatUser.uid].sort().join('_');await addDoc(collection(db,'chats',cid,'messages'),{from:me.uid,to:chatUser.uid,text,createdAt:serverTimestamp()});await notify(chatUser.uid,'message',me.displayName+' sana mesaj gönderdi.');$('chatInput').value='';$('chatError').textContent=''};
$('backPeople').onclick=()=>show('peopleView');
function listenNotices(){if(unsubNotices)unsubNotices();unsubNotices=onSnapshot(query(collection(db,'notifications'),where('to','==',me.uid),orderBy('createdAt','desc'),limit(40)),s=>{$('noticeList').innerHTML='';s.forEach(d=>{const n=d.data(),el=document.createElement('div');el.className='notif';el.textContent=n.text||'Yeni bildirim';$('noticeList').append(el);if(!n.read&&Notification.permission==='granted'){new Notification('UN AsosyaL',{body:n.text||'Yeni bildirim'});beep()}})})}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch{}}
$('notifyBtn').onclick=async()=>{if(!('Notification'in window)){$('profileMsg').textContent='Bu tarayıcı bildirimleri desteklemiyor.';return}const p=await Notification.requestPermission();$('profileMsg').textContent=p==='granted'?'Bildirim izni verildi.':'Bildirim izni verilmedi.';if(p==='granted')new Notification('UN AsosyaL',{body:'Bildirimler açıldı!'});};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else{$('profileMsg').textContent='Chrome menüsünden “Ana ekrana ekle” veya “Uygulamayı yükle” seçeneğini kullan.'}};
</script></body></html>
