const appFB=initializeApp(firebaseConfig),auth=getAuth(appFB),db=getFirestore(appFB),storage=getStorage(appFB);const $=id=>document.getElementById(id);let registering=false,me=null,chatUser=null,unsubChat=null,installPrompt=null,unsubNotices=null,postImage=null,postVideo=null,recorder=null,recordChunks=[],noticeSeen=new Set();

$('modeBtn').onclick=()=>{registering=!registering;$('registerFields').classList.toggle('hidden',!registering);$('authTitle').textContent=registering?'Hesap oluştur':'Giriş yap';$('authBtn').textContent=registering?'Kayıt ol':'Giriş yap';$('modeBtn').textContent=registering?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';$('authError').textContent='';$('password').autocomplete=registering?'new-password':'current-password'};
$('authBtn').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value; $('authError').textContent='';try{if(!email||!password)throw Error('E-posta ve şifre gerekli.');if(registering){const username=$('username').value.trim().toLowerCase(),displayName=$('displayName').value.trim();if(!/^[a-z0-9_.]{3,20}$/.test(username))throw Error('Kullanıcı adı 3-20 karakter olmalı; harf, rakam, _ ve . kullan.');if(!displayName)throw Error('Görünen adını yaz.');const taken=await getDoc(doc(db,'usernames',username));if(taken.exists())throw Error('Bu kullanıcı adı alınmış.');const cred=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,email,username,displayName,private:false,createdAt:serverTimestamp()});await setDoc(doc(db,'usernames',username),{uid:cred.user.uid});}else await signInWithEmailAndPassword(auth,email,password);}catch(e){$('authError').textContent=msg(e)}};
onAuthStateChanged(auth,async user=>{if(!user){me=null;$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('tabs').classList.add('hidden');if(unsubNotices)unsubNotices();return}const snap=await getDoc(doc(db,'users',user.uid));if(!snap.exists()){$('authError').textContent='Kullanıcı profili bulunamadı.';return}me={uid:user.uid,...snap.data()};$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('tabs').classList.remove('hidden');await refreshAll();listenNotices();show('feedView')});
$('logout').onclick=()=>signOut(auth);
function show(id){['feedView','peopleView','exploreView','profileView','chatView','noticeView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('viewTitle').textContent=({feedView:'Akış',peopleView:'Kişi ara',exploreView:'Bakış',profileView:'Profil',chatView:'Mesajlar',noticeView:'Bildirimler'})[id];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{show(b.dataset.view);if(b.dataset.view==='exploreView')loadExplore();if(b.dataset.view==='peopleView')loadPeople()});

async function refreshAll(){await Promise.all([loadFeed(),loadPeople(),loadProfile()])}
async function allUsers(){const s=await getDocs(collection(db,'users'));return s.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.uid!==me.uid)}
async function followData(uid){const [a,b]=await Promise.all([getDocs(query(collection(db,'follows'),where('follower','==',uid))),getDocs(query(collection(db,'follows'),where('following','==',uid)))]);return {following:a.docs.map(d=>d.data().following),followers:b.docs.map(d=>d.data().follower)}}
async function loadPeople(){if(!me)return;const box=$('peopleList'),status=$('peopleSearchStatus'),raw=$('peopleSearch').value.trim().replace(/^@/,'').toLocaleLowerCase('tr');box.innerHTML='';status.textContent='Aranıyor...';try{let users=[];if(raw){const usernameDoc=await getDoc(doc(db,'usernames',raw));if(usernameDoc.exists()){const uid=usernameDoc.data().uid,us=await getDoc(doc(db,'users',uid));if(us.exists()&&uid!==me.uid)users.push({uid,...us.data()})}if(!users.length){const all=await allUsers();for(const u of all){if((u.username||'').toLocaleLowerCase('tr').includes(raw)||(u.displayName||'').toLocaleLowerCase('tr').includes(raw)){if(!users.some(x=>x.uid===u.uid))users.push(u)}}}}else users=await allUsers();const mine=await followData(me.uid),requests=await getDocs(query(collection(db,'followRequests'),where('from','==',me.uid)));const reqSet=new Set(requests.docs.map(d=>d.data().to));for(const u of users){const isFollowing=mine.following.includes(u.uid),isFollower=mine.followers.includes(u.uid),requestSent=reqSet.has(u.uid);const row=document.createElement('div');row.className='person';const action=u.private?(isFollowing?'<button data-unfollow>Takipten çık</button>':requestSent?'<button class="secondary" disabled>İstek gönderildi</button>':'<button data-follow>İstek gönder</button>'):(isFollowing?'<button data-unfollow>Takipten çık</button>':'<button data-follow>Takip et</button>');row.innerHTML=`<div><strong>${esc(u.displayName||'Kullanıcı')}</strong><span class="muted">@${esc(u.username||'')} ${isFollower?'· Seni takip ediyor':''}</span></div><div>${action} <button class="secondary" data-profile>Profil</button></div>`;row.querySelector('[data-follow]')?.addEventListener('click',()=>follow(u));row.querySelector('[data-unfollow]')?.addEventListener('click',()=>unfollow(u));row.querySelector('[data-profile]')?.addEventListener('click',()=>viewUser(u));box.append(row)}status.textContent=users.length?`${users.length} kişi bulundu.`:(raw?'Bu aramayla eşleşen kişi bulunamadı.':'Henüz başka kullanıcı yok.')}catch(e){status.textContent='Kişiler yüklenemedi: '+msg(e)}}
$('peopleSearch').oninput=()=>loadPeople();
async function notify(to,type,text,from=me.uid){await addDoc(collection(db,'notifications'),{to,from,type,text,read:false,createdAt:serverTimestamp()})}
async function follow(u){try{if(u.private){await addDoc(collection(db,'followRequests'),{from:me.uid,to:u.uid,createdAt:serverTimestamp()});await notify(u.uid,'request',me.displayName+' takip isteği gönderdi.')}else{await setDoc(doc(db,'follows',me.uid+'_'+u.uid),{follower:me.uid,following:u.uid,createdAt:serverTimestamp()});await notify(u.uid,'follow',me.displayName+' seni takip etmeye başladı.')}await loadPeople();await loadProfile()}catch(e){alert(msg(e))}}
async function unfollow(u){await deleteDoc(doc(db,'follows',me.uid+'_'+u.uid));await loadPeople();await loadProfile()}
async function viewUser(u){const counts=await followData(u.uid),mine=await followData(me.uid),following=mine.following.includes(u.uid);if(u.private&&!following){alert('Bu hesap gizli. Paylaşımlarını görmek için takip isteği göndermelisin.');return}const canMessage=following&&counts.following.includes(me.uid);if(canMessage){openChat(u);return}alert('Mesaj göndermek için birbirinizi takip etmeniz gerekiyor.');}
async function loadProfile(){const counts=await followData(me.uid),posts=await getDocs(query(collection(db,'posts'),where('uid','==',me.uid)));$('myName').textContent=me.displayName;$('myHandle').textContent='@'+me.username;$('followers').textContent=counts.followers.length;$('following').textContent=counts.following.length;$('myPosts').textContent=posts.size;$('privateToggle').checked=!!me.private;const rq=await getDocs(query(collection(db,'followRequests'),where('to','==',me.uid)));$('requests').innerHTML='';for(const d of rq.docs){const r=d.data(),us=await getDoc(doc(db,'users',r.from));if(!us.exists())continue;const u=us.data(),el=document.createElement('div');el.className='person';el.innerHTML=`<span><b>${esc(u.displayName)}</b><small class="muted"> @${esc(u.username)}</small></span><button>Kabul et</button>`;el.querySelector('button').onclick=async()=>{await setDoc(doc(db,'follows',r.from+'_'+me.uid),{follower:r.from,following:me.uid,createdAt:serverTimestamp()});await deleteDoc(d.ref);await notify(r.from,'accepted',me.displayName+' takip isteğini kabul etti.');loadProfile();loadPeople()};$('requests').append(el)}}
$('privateToggle').onchange=async()=>{me.private=$('privateToggle').checked;await updateDoc(doc(db,'users',me.uid),{private:me.private});$('profileMsg').textContent=me.private?'Hesabın artık gizli.':'Hesabın herkese açık.';};
function compressImage(file,maxDim=900,quality=.65){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const k=Math.min(1,maxDim/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{resolve(c.toDataURL('image/jpeg',quality))}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Fotoğraf okunamadı'))};img.src=url})}

$('removePostPhoto').onclick=()=>{postImage=null;postVideo=null;$('postPreview').removeAttribute('src');$('postPreview').classList.add('hidden');$('postVideoPreview').pause();$('postVideoPreview').removeAttribute('src');$('postVideoPreview').classList.add('hidden');$('removePostPhoto').classList.add('hidden')};
async function renderPost(p,target,{reel=false}={}){p.likes=p.likes||[];const el=document.createElement('article');el.className=reel?'post reel-card':'post';const head=document.createElement('div');head.innerHTML=`<b>${esc(p.displayName||'Kullanıcı')}</b> <small>@${esc(p.username||'')}</small>`;el.append(head);if(p.text){const para=document.createElement('p');para.textContent=p.text;el.append(para)}if(p.videoUrl){const v=document.createElement('video');v.className='post-video';v.src=p.videoUrl;v.controls=true;v.playsInline=true;v.preload='metadata';el.append(v)}else if(p.image){const im=document.createElement('img');im.className='post-img';im.alt='Paylaşım fotoğrafı';im.src=p.image;el.append(im)}const date=document.createElement('small');date.textContent=p.createdAt?.toDate?.().toLocaleString('tr-TR')||'Yeni paylaşım';el.append(date);const actions=document.createElement('div');actions.className='post-actions';const liked=p.likes.includes(me.uid),like=document.createElement('button');like.className=liked?'liked':'';like.textContent=(liked?'♥ ':'♡ ')+p.likes.length;like.onclick=async()=>{try{const next=liked?p.likes.filter(x=>x!==me.uid):[...p.likes,me.uid];await updateDoc(doc(db,'posts',p.id),{likes:next});await loadFeed();if(reel)await loadExplore()}catch(e){alert('Beğeni kaydedilemedi: '+msg(e))}};actions.append(like);const commentBtn=document.createElement('button');commentBtn.textContent='💬 Yorumlar';actions.append(commentBtn);if(p.uid===me.uid){const del=document.createElement('button');del.textContent='Sil';del.onclick=async()=>{if(confirm('Bu paylaşımı silmek istiyor musun?')){await deleteDoc(doc(db,'posts',p.id));await loadFeed();await loadExplore();await loadProfile()}};actions.append(del)}el.append(actions);const comments=document.createElement('div');comments.className='post-comments hidden';const list=document.createElement('div');list.className='comments-list';const form=document.createElement('div');form.className='comment-form';const input=document.createElement('input');input.placeholder='Yorum yaz...';input.maxLength=300;const send=document.createElement('button');send.textContent='Gönder';form.append(input,send);comments.append(list,form);el.append(comments);let loaded=false;async function loadComments(){const cs=await getDocs(query(collection(db,'posts',p.id,'comments'),orderBy('createdAt','asc'),limit(50)));list.innerHTML='';cs.forEach(c=>{const d=c.data(),line=document.createElement('div');line.className='comment';line.innerHTML=`<b>${esc(d.displayName||'Kullanıcı')}</b> <span class="muted">@${esc(d.username||'')}</span> ${esc(d.text||'')}`;list.append(line)});loaded=true}commentBtn.onclick=async()=>{comments.classList.toggle('hidden');if(!loaded)try{await loadComments()}catch(e){list.textContent='Yorumlar yüklenemedi: '+msg(e)}};send.onclick=async()=>{const value=input.value.trim();if(!value)return;send.disabled=true;try{await addDoc(collection(db,'posts',p.id,'comments'),{uid:me.uid,username:me.username,displayName:me.displayName,text:value,createdAt:serverTimestamp()});input.value='';await loadComments()}catch(e){list.textContent='Yorum gönderilemedi: '+msg(e)}finally{send.disabled=false}};target.append(el)}
async function loadFeed(){try{const s=await getDocs(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(60))),follows=await followData(me.uid);$('feedList').innerHTML='';let count=0;for(const d of s.docs){const p={id:d.id,...d.data()};if(p.uid!==me.uid&&!follows.following.includes(p.uid)){const us=await getDoc(doc(db,'users',p.uid));if(us.exists()&&us.data().private)continue}count++;await renderPost(p,$('feedList'))}if(!count)$('feedList').innerHTML='<div class="muted" style="text-align:center;padding:25px">Henüz paylaşım yok.</div>'}catch(e){$('feedList').textContent='Akış yüklenemedi: '+msg(e)}}
async function loadExplore(){if(!me)return;try{const s=await getDocs(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(80))),mine=await followData(me.uid);$('exploreList').innerHTML='';let count=0;for(const d of s.docs){const p={id:d.id,...d.data()};if(p.uid!==me.uid&&!mine.following.includes(p.uid)){const us=await getDoc(doc(db,'users',p.uid));if(us.exists()&&us.data().private)continue}count++;await renderPost(p,$('exploreList'),{reel:true})}if(!count)$('exploreList').innerHTML='<div class="muted" style="text-align:center;padding:24px">Reels bölümünde henüz paylaşım yok.</div>'}catch(e){$('exploreList').textContent='Reels yüklenemedi: '+msg(e)}}

async function openChat(u){const counts=await followData(u.uid),mine=await followData(me.uid);if(!mine.following.includes(u.uid)||!counts.following.includes(me.uid)){alert('Mesaj göndermek için karşılıklı takip gerekiyor.');return}chatUser=u;$('chatWith').textContent=u.displayName+' (@'+u.username+')';show('chatView');if(unsubChat)unsubChat();const cid=[me.uid,u.uid].sort().join('_');unsubChat=onSnapshot(query(collection(db,'chats',cid,'messages'),orderBy('createdAt','asc')),s=>{$('chatMessages').innerHTML='';s.forEach(d=>{const m=d.data(),el=document.createElement('div');el.className='bubble '+(m.from===me.uid?'mine':'');if(m.image){const im=document.createElement('img');im.className='msg-img';im.src=m.image;im.alt='Gönderilen fotoğraf';el.append(im)}if(m.audio){const au=document.createElement('audio');au.controls=true;au.src=m.audio;el.append(au)}if(m.text){const t=document.createElement('div');t.textContent=m.text;el.append(t)}const tm=document.createElement('small');tm.textContent=m.createdAt?.toDate?.().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})||'';el.append(tm);$('chatMessages').append(el)});$('chatMessages').scrollTop=$('chatMessages').scrollHeight})}
async function sendChat(payload){if(!chatUser)return;const [counts,mine]=await Promise.all([followData(chatUser.uid),followData(me.uid)]);if(!mine.following.includes(chatUser.uid)||!counts.following.includes(me.uid))throw Error('Mesaj göndermek için karşılıklı takip gerekiyor.');const cid=[me.uid,chatUser.uid].sort().join('_');await addDoc(collection(db,'chats',cid,'messages'),{from:me.uid,to:chatUser.uid,text:payload.text||'',image:payload.image||null,audio:payload.audio||null,createdAt:serverTimestamp()});await notify(chatUser.uid,'message',me.displayName+' sana mesaj gönderdi.')}
$('sendMsg').onclick=async()=>{const text=$('chatInput').value.trim();if(!text||!chatUser)return;try{await sendChat({text});$('chatInput').value='';$('chatError').textContent=''}catch(e){$('chatError').textContent=msg(e)}};
$('chatFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const image=await compressImage(f,850,.6);if(image.length>850000)throw Error('Fotoğraf çok büyük');await sendChat({image});$('chatError').textContent=''}catch(err){$('chatError').textContent='Fotoğraf gönderilemedi: '+msg(err)}e.target.value=''};
$('chatPhotoBtn').onclick=()=>$('chatFile').click();
$('recordBtn').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();$('recordBtn').textContent='🎙 Ses kaydı';$('recordStatus').textContent='Ses hazırlanıyor...';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('chatError').textContent='Ses kaydı için Chrome gibi HTTPS destekli bir tarayıcı kullan.';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];const type=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,type?{mimeType:type}:{});recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('recordStatus').textContent='';const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(blob.size>650000){$('chatError').textContent='Ses kaydı çok uzun. Daha kısa kayıt yap.';return}const reader=new FileReader();reader.onload=async()=>{try{await sendChat({audio:reader.result})}catch(err){$('chatError').textContent=msg(err)}};reader.readAsDataURL(blob)};recorder.start();$('recordBtn').textContent='■ Kaydı bitir';$('recordStatus').textContent='Kayıt sürüyor...';setTimeout(()=>{if(recorder&&recorder.state==='recording'){recorder.stop();$('recordBtn').textContent='🎙 Ses kaydı'}},60000)}catch(e){$('chatError').textContent='Mikrofon izni verilmedi veya mikrofon kullanılamıyor.'}};
$('backPeople').onclick=()=>show('peopleView');
function listenNotices(){if(unsubNotices)unsubNotices();unsubNotices=onSnapshot(query(collection(db,'notifications'),where('to','==',me.uid),orderBy('createdAt','desc'),limit(40)),s=>{$('noticeList').innerHTML='';s.forEach(d=>{const n=d.data(),el=document.createElement('div');el.className='notif';el.textContent=n.text||'Yeni bildirim';$('noticeList').append(el);if(!n.read&&!noticeSeen.has(d.id)){noticeSeen.add(d.id);if('Notification'in window&&Notification.permission==='granted')new Notification('UN AsosyaL',{body:n.text||'Yeni bildirim'});beep()}})})}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch{}}
$('notifyBtn').onclick=async()=>{if(!('Notification'in window)){$('profileMsg').textContent='Bu tarayıcı bildirimleri desteklemiyor.';return}const p=await Notification.requestPermission();$('profileMsg').textContent=p==='granted'?'Bildirim izni verildi.':'Bildirim izni verilmedi.';if(p==='granted')new Notification('UN AsosyaL',{body:'Bildirimler açıldı!'});};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else{$('profileMsg').textContent='Chrome menüsünden “Ana ekrana ekle” veya “Uygulamayı yükle” seçeneğini kullan.'}};
</script></body></html>
